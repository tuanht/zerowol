[package]
name = "zerowol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "zerowol"
path = "src/lib.rs"

[[bin]]
name = "zerowol"
path = "src/main.rs"

[features]
# Development only: fake machines with simulated status (ZEROWOL_DEV_FAKES=1). Never enable for release builds.
dev-fakes = []

[dependencies]
zerowol-proto = { path = "../zerowol-proto" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
rand = "0.10"
base64 = "0.23"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
